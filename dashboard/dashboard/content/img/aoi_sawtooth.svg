<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="30" y="22" font-size="15" font-weight="bold" fill="#1a1a1a">Age of Information is a sawtooth: it grows with time and drops when a fresher result arrives</text>
  <text x="30" y="40" fill="#555">Schematic drawn from the CN-T7 means (latency P50 and results per second). It is not a measured trace.</text>
  <!-- axes: y = 290 - ms*0.33 ; x = 70 + n*85 -->
  <line x1="70" y1="290" x2="690" y2="290" stroke="#333"/>
  <line x1="70" y1="60" x2="70" y2="290" stroke="#333"/>
  <g fill="#555" font-size="11" text-anchor="end">
    <text x="64" y="294">0</text><text x="64" y="228">200</text><text x="64" y="162">400</text><text x="64" y="96">600</text>
  </g>
  <g stroke="#e3e3e3">
    <line x1="70" y1="224" x2="690" y2="224"/><line x1="70" y1="158" x2="690" y2="158"/><line x1="70" y1="92" x2="690" y2="92"/>
  </g>
  <text x="20" y="180" fill="#333" transform="rotate(-90 20 180)" text-anchor="middle">age of newest AI result (ms)</text>
  <text x="380" y="316" fill="#333" text-anchor="middle">time (one tooth = 57 ms = one result)</text>
  <!-- FIFO: low 600 -> y 92 ; peak 657 -> y 73.2 -->
  <polyline fill="none" stroke="#c0392b" stroke-width="2"
    points="70,92 155,73.2 155,92 240,73.2 240,92 325,73.2 325,92 410,73.2 410,92 495,73.2 495,92 580,73.2 580,92 665,73.2"/>
  <line x1="70" y1="84.4" x2="690" y2="84.4" stroke="#c0392b" stroke-dasharray="6 4"/>
  <text x="684" y="64" text-anchor="end" fill="#c0392b" font-weight="bold">FIFO: mean 623 ms</text>
  <!-- latest: low 175 -> y 232.25 ; peak 232 -> y 213.4 -->
  <polyline fill="none" stroke="#1f6fb2" stroke-width="2"
    points="70,232.2 155,213.4 155,232.2 240,213.4 240,232.2 325,213.4 325,232.2 410,213.4 410,232.2 495,213.4 495,232.2 580,213.4 580,232.2 665,213.4"/>
  <line x1="70" y1="222.7" x2="690" y2="222.7" stroke="#1f6fb2" stroke-dasharray="6 4"/>
  <text x="684" y="204" text-anchor="end" fill="#1f6fb2" font-weight="bold">latest-value: mean 204 ms</text>
  <!-- annotation -->
  <line x1="240" y1="232.2" x2="240" y2="288" stroke="#555" stroke-dasharray="3 3"/>
  <text x="246" y="268" fill="#333">L = age just after a delivery</text>
  <text x="246" y="282" fill="#333">(the result's own latency)</text>
</svg>
