site_name: Edge AI Video Runtime — Học cùng nhau
site_url: https://kaiserrichard.github.io/edge-ai-video-runtime/
repo_url: https://github.com/KaiserRichard/edge-ai-video-runtime
edit_uri: ""
docs_dir: docs
exclude_docs: |
  assets/**/*.md
theme:
  name: material
  language: vi
  palette:
  - scheme: default
    toggle:
      icon: material/weather-night
      name: Chế độ tối
  - scheme: slate
    toggle:
      icon: material/weather-sunny
      name: Chế độ sáng
  features:
  - navigation.sections
  - navigation.top
  - content.code.copy
  - search.highlight
plugins:
- search
markdown_extensions:
- admonition
- attr_list
- md_in_html
- pymdownx.details
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.arithmatex:
    generic: true
- pymdownx.tabbed:
    alternate_style: true
- tables
extra_javascript:
- javascripts/mathjax.js
- https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
- javascripts/study.js
- javascripts/widgets.js
extra_css:
- stylesheets/study.css
nav:
  - "Bạn là ai?": index.md
  - "Lộ trình":
      - "Hiếu": roadmap/hieu.md
      - "Vinh": roadmap/vinh.md
      - "Mạnh": roadmap/manh.md
      - "Trường": roadmap/truong.md
      - "Khánh — cả nhóm": roadmap/khanh.md
  - "Bài học":
      - "CN Session 1 — Sản phẩm":
          - "A. Sản phẩm và đường đi dữ liệu": sessions/01-A-cn-product.md
          - "B. RTP và receiver": sessions/01-B-cn-mechanisms.md
          - "C. Thực hành và đọc log": sessions/01-C-cn-demo.md
      - "CN Session 2 — SimEvents":
          - "A. Nền tảng SimEvents": sessions/02-A-simevents-theory.md
          - "B. Mô hình v2": sessions/02-B-simevents-model.md
          - "C. Kết quả và bằng chứng": sessions/02-C-cn-evidence.md
          - "D. Tổng hợp và bảo vệ": sessions/02-D-cn-defence.md
      - "OS Session 3 — Linux":
          - "A. Lý thuyết": sessions/03-A-linux-theory.md
          - "B. Pipeline thực tế": sessions/03-B-linux-pipeline.md
          - "C. Bằng chứng": sessions/03-C-linux-evidence.md
      - "OS Session 4 — STM32":
          - "A. RTOS và UART": sessions/04-A-rtos-theory.md
          - "B. Firmware và Stateflow": sessions/04-B-stm32-implementation.md
          - "C. Fault injection": sessions/04-C-supervisor-evidence.md
  - "Trình bày với thầy":
      - "Luyện bảo vệ": defence/index.md
      - "Hỏi ngoài phần mình": defence/outside.md
  - "Demo phần cứng": demo/index.md
