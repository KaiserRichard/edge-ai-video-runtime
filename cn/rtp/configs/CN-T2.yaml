scenario: T2
config: ethernet_baseline_playout_50ms
interface: eth0
capture_interface: any
repetitions: 5
links: {sender: local, receiver: local}
commands:
  sender: "python -m rtp.sender --host 127.0.0.1 --duration {duration_s} --fps 15 --playout-ms 50"
  receiver: "python -m rtp.receiver --bind 0.0.0.0 --playout-ms 50"
  ai: "python -m rtp.ai --bind 0.0.0.0"
steps:
  - {netem: "", duration_s: 65}
