scenario: T5
config: jpeg_quality_packet_size
interface: eth0
capture_interface: any
repetitions: 5
links: {sender: local, receiver: local}
commands:
  sender: "python -m rtp.sender --host 127.0.0.1 --duration {duration_s} --quality 30 60 90 --payload-bytes 500 1200 1400 3000"
  receiver: "python -m rtp.receiver --bind 0.0.0.0"
  ai: "python -m rtp.ai --bind 0.0.0.0"
steps:
  - {netem: "", duration_s: 65}
  - {netem: "loss 2%", duration_s: 65}
