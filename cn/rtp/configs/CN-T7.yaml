scenario: T7
config: fifo_and_latest_value
interface: eth0
capture_interface: any
repetitions: 5
links: {sender: local, receiver: local}
commands:
  sender: "python -m rtp.sender --host 127.0.0.1 --duration {duration_s} --fps 30"
  receiver: "python -m rtp.receiver --bind 0.0.0.0 --policy fifo latest"
  ai: "python -m rtp.ai --bind 0.0.0.0 --threads 4"
steps:
  - {netem: "", duration_s: 65}
